name: CI

# One Linux job per pull request: formatting, vet, tests and a build check
# for all six platforms. Windows/macOS tests cost 2x/10x Linux minutes, so
# they run only on demand (Actions tab -> CI -> Run workflow).
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      all-platforms:
        description: Also run the tests on Windows and macOS (costs more minutes)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "Run gofmt on the files above."; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build all platforms
        run: scripts/build.sh "ci-${GITHUB_RUN_NUMBER}"

  other-platforms:
    name: Test (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch' && inputs.all-platforms
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
