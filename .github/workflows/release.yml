name: Release

# Every change merged into main is tested, built for all platforms and
# published as a GitHub release, in a single Linux job.
#   - push to main      -> version v<VERSION>.<run number>, e.g. v1.0.12
#   - push a tag v*     -> that exact version, e.g. v2.0.0
#   - manual run        -> same as a push to main
# Edit the VERSION file to move to a new major/minor series.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go vet ./...
      - run: go test ./...

      - name: Choose version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="$REF_NAME"
          else
            version="v$(tr -d '[:space:]' < VERSION).${RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version must look like v1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build.sh "$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          | Computer | File |
          |----------|------|
          | Mac with Apple chip (M1 and newer) | `confluence-exporter-macos-apple-silicon` |
          | Mac with Intel chip | `confluence-exporter-macos-intel` |
          | Windows (most PCs) | `confluence-exporter-windows-x64.exe` |
          | Windows on ARM | `confluence-exporter-windows-arm64.exe` |
          | Linux | `confluence-exporter-linux-x64` / `confluence-exporter-linux-arm64` |

          See the README for how to start the app. `SHA256SUMS.txt` lets you verify the downloads.
          NOTES
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md \
            --generate-notes
